# Build installers for all three desktop platforms.
#
# WHY CI RATHER THAN DOCKER. Tauri cannot cross-compile: a .dmg has to be built
# on macOS and a .msi on Windows, because each links against that platform's own
# webview and toolchain. Docker only covers the Linux target. A build matrix is
# the one way to produce all three from a single action.
#
# Triggered by pushing a tag, or manually from the Actions tab.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # One platform failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          # A universal binary covers both Apple Silicon and Intel Macs, so
          # there is one .dmg to hand out rather than two.
          - platform: macos-latest
            target: universal-apple-darwin
            label: macOS
          - platform: ubuntu-22.04
            target: ""
            label: Linux
          - platform: windows-latest
            target: ""
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
      FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
      FACEBOOK_REDIRECT_URI: ${{ secrets.FACEBOOK_REDIRECT_URI }}
      INSTAGRAM_CLIENT_ID: ${{ secrets.INSTAGRAM_CLIENT_ID }}
      INSTAGRAM_CLIENT_SECRET: ${{ secrets.INSTAGRAM_CLIENT_SECRET }}
      INSTAGRAM_REDIRECT_URI: ${{ secrets.INSTAGRAM_REDIRECT_URI }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      # Compiled in via option_env! at build time. Without it the app
      # reports licensing as OFF and ships ungated - a GitHub secret
      # alone never reaches the compiler, it has to be passed here.
      LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      # WebKitGTK and its friends are not on the Ubuntu runner by default.
      # Pinned to 22.04 because 24.04 ships a webkit2gtk version Tauri v2 does
      # not yet build against cleanly.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Building universal on macOS needs both architectures present.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # Tests are cheap next to a full Tauri build, and a broken build is worth
      # catching before spending ten minutes bundling it.
      # Ship yt-dlp and ffmpeg inside the installer so a fresh Windows machine
      # works with no first-run download at all. Fetched here rather than
      # committed: they total ~190 MB and go stale quickly, so a copy in git
      # would bloat every clone and still be out of date.
      #
      # tauri.windows.conf.json lists these three by name, so the build fails
      # loudly if any is missing rather than shipping a broken installer.
      - name: Fetch bundled tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "src-tauri/resources/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          # curl.exe, not Invoke-WebRequest. IWR has no retry and buffers the
          # whole body, so a dropped connection part way through a 100 MB
          # download fails the entire build with "An existing connection was
          # forcibly closed by the remote host" — which is what GitHub's CDN
          # does under load, and it is not a reason to fail a release.
          #
          # --retry-all-errors is the important flag: without it curl retries
          # only transfers the server explicitly failed, not the ones that
          # simply died mid-stream, which is this exact case.
          function Get-Tool($Uri, $OutFile) {
            & curl.exe --location --fail --show-error --silent `
              --retry 5 --retry-delay 3 --retry-all-errors `
              --connect-timeout 30 --max-time 900 `
              --output $OutFile $Uri
            if ($LASTEXITCODE -ne 0) { throw "download failed ($LASTEXITCODE): $Uri" }
            if (-not (Test-Path $OutFile)) { throw "download produced no file: $Uri" }
            # A truncated download is worse than a failed one: it gets bundled
            # and ships an installer whose tools do not run.
            if ((Get-Item $OutFile).Length -lt 100kb) {
              throw "download is too small to be real: $Uri"
            }
          }

          Get-Tool "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" "$bin/yt-dlp.exe"

          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $out = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          Get-Tool "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force

          # The archive nests binaries under <name>/bin/, so search by filename.
          foreach ($tool in "ffmpeg", "ffprobe") {
            $src = Get-ChildItem -Path $out -Recurse -Filter "$tool.exe" | Select-Object -First 1
            if (-not $src) { throw "$tool.exe was not in the ffmpeg archive" }
            Copy-Item $src.FullName "$bin/$tool.exe" -Force
          }

          foreach ($f in "yt-dlp.exe", "ffmpeg.exe", "ffprobe.exe") {
            if (-not (Test-Path "$bin/$f")) { throw "bundled tool missing: $f" }
          }
          Get-ChildItem $bin | Format-Table Name, Length

      - name: Test
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SocialSync ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Also keep the artefacts on the run itself, so a manual dispatch (which
      # has no tag to attach a release to) still produces something downloadable.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: media-downloader-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: warn
